url: https://mghotbi.github.io/HRRI/

template:
  bootstrap: 5
  bslib:
    primary: "#2f6b6b"      # redox teal
    secondary: "#8c4a2f"    # iron rust
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Source Serif 4"}
    code_font: {google: "JetBrains Mono"}

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
      - text: End-to-end workflow
        href: articles/HRRI_workflow.html
      - text: Gallery
        href: articles/HRRI_gallery.html

reference:

- title: Scoring pipelines
  desc: >
    Turn observed plant, soil and microbial measurements into a composite
    resilience score, with explicit direction anchoring and coverage
    diagnostics.
  contents:
  - rri_pipeline
  - rri_pipeline_st
  - rri_reference_scores
  - attach_hrri_ids

- title: The four hidden states
  desc: >
    Capacity, connectivity, kinetics and memory, and the accessible-capacity
    expression that combines them over an event window.
  contents:
  - rri_accessible_capacity
  - rri_default_reservoirs
  - rri_capacity_index
  - rri_connectivity_score
  - rri_kinetics_score
  - rri_memory_index
  - rri_property_scores

- title: Recovery signatures
  desc: >
    Lag, overshoot, hysteresis, truncation, incomplete return and persistent
    alternative routing, extracted from a scored trajectory.
  contents:
  - rri_recovery_metrics
  - rri_compensation_index
  - rri_root_physio
  - rri_micro_functional_score
  - rri_o2_demand

- title: Model checking
  desc: >
    Whether the score behaves as claimed. Agreement statistics respect the
    clustering of repeated observations; influence and sensitivity show where
    the composite's variance actually comes from.
  contents:
  - rri_accuracy
  - rri_domain_influence
  - rri_sensitivity
  - rri_latent_correlation
  - benchmark_hrri
  - hrri_infer_architecture

- title: Figures
  desc: Plotting functions, each documenting what its panels do and do not show.
  contents:
  - plot_rri_accuracy
  - plot_rri_properties
  - plot_rri_recovery_landscape
  - plot_rri_recovery_map
  - plot_rri_state_space
  - plot_rri_timeseries
  - plot_rri_validation
  - plot_RRI_ternary
  - plot_hrri_benchmark
  - plot_rri_simulation_demo
  - theme_ems

- title: Simulation
  desc: >
    An illustrative generator with closed Fe and Mn inventories. Its outputs
    are for demonstration and internal consistency checks, not calibration.
  contents:
  - simulate_redox_holobiont
  - rri_simulation_demo
  - HRRI_workflow_example

articles:
- title: Articles
  navbar: ~
  contents:
  - HRRI_workflow
  - HRRI_gallery

news:
  releases:
  - text: "Changelog"
    href: news/index.html
